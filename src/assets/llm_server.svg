<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="llmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadowLlm">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#llmBg)" />

  <!-- Hex tech pattern -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.3">
    <polygon points="100,50 140,75 140,125 100,150 60,125 60,75" fill="none" />
    <polygon points="200,50 240,75 240,125 200,150 160,125 160,75" fill="none" />
    <polygon points="700,350 740,375 740,425 700,450 660,425 660,375" fill="none" />
    <polygon points="600,350 640,375 640,425 600,450 560,425 560,375" fill="none" />
  </g>

  <!-- Main Container -->
  <g filter="url(#shadowLlm)">
    <rect x="70" y="50" width="660" height="400" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect x="70" y="50" width="660" height="45" rx="16" fill="#0369a1" opacity="0.25" />
    <circle cx="100" cy="72" r="6" fill="#ef4444" />
    <circle cx="120" cy="72" r="6" fill="#f59e0b" />
    <circle cx="140" cy="72" r="6" fill="#10b981" />
    <text x="400" y="78" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">
      ollama-server@oracle-cloud:~/n8n-docker-automation
    </text>
  </g>

  <!-- Left: Terminal CLI -->
  <rect x="100" y="120" width="340" height="295" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="120" y="150" fill="#22c55e" font-family="monospace" font-size="13">$ ollama run llama3.1:8b</text>
  <text x="120" y="175" fill="#94a3b8" font-family="monospace" font-size="12">&gt;&gt;&gt; Model loaded: 8.03 GB (GPU/CPU offload)</text>
  <text x="120" y="200" fill="#94a3b8" font-family="monospace" font-size="12">&gt;&gt;&gt; API Port bound: 11434 (Authenticated)</text>
  <text x="120" y="235" fill="#38bdf8" font-family="monospace" font-size="13">$ docker ps --format "{{.Names}}"</text>
  <text x="120" y="260" fill="#f1f5f9" font-family="monospace" font-size="12">&#x25CF; n8n_workflow_engine (Up 38 days)</text>
  <text x="120" y="285" fill="#f1f5f9" font-family="monospace" font-size="12">&#x25CF; ollama_inference_container (Up 38 days)</text>
  
  <rect x="120" y="325" width="300" height="65" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1" />
  <text x="135" y="348" fill="#10b981" font-family="monospace" font-size="12">&#x2713; Cron Keep-Alive Uptime: 99.98%</text>
  <text x="135" y="372" fill="#e2e8f0" font-family="monospace" font-size="11">Swap Memory: 16 GB | Oracle Linux VM</text>

  <!-- Right: n8n Flow & Model Visual -->
  <rect x="460" y="120" width="240" height="295" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">AI Pipeline Flow</text>

  <!-- Pipeline Node 1 -->
  <rect x="480" y="170" width="200" height="42" rx="8" fill="url(#cyanGrad)" opacity="0.85" />
  <text x="580" y="196" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">n8n Event Trigger</text>

  <!-- Connector Line -->
  <line x1="580" y1="212" x2="580" y2="232" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Pipeline Node 2 -->
  <rect x="480" y="232" width="200" height="42" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="580" y="258" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Llama 3.1 8B Inference</text>

  <!-- Connector Line -->
  <line x1="580" y1="274" x2="580" y2="294" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Pipeline Node 3 -->
  <rect x="480" y="294" width="200" height="42" rx="8" fill="#10b981" opacity="0.8" />
  <text x="580" y="320" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Automated Webhooks</text>

  <!-- Specs badge -->
  <rect x="480" y="355" width="200" height="38" rx="6" fill="#0f172a" />
  <text x="580" y="378" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Local API &bull; 0 Cloud Cost</text>
</svg>