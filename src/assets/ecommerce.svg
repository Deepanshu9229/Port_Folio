<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Grid lines -->
  <g stroke="#312e81" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Main Showcase Window -->
  <g filter="url(#shadow)">
    <rect x="70" y="50" width="660" height="400" rx="16" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect x="70" y="50" width="660" height="45" rx="16" fill="#1e1b4b" opacity="0.8" />
    <circle cx="100" cy="72" r="6" fill="#ef4444" />
    <circle cx="120" cy="72" r="6" fill="#f59e0b" />
    <circle cx="140" cy="72" r="6" fill="#10b981" />
    
    <text x="400" y="78" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      E-Commerce Platform • Storefront &amp; CMS Admin
    </text>
  </g>

  <!-- Product / Content Cards -->
  <!-- Left Card: Storefront UI -->
  <rect x="100" y="125" width="260" height="290" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <rect x="115" y="145" width="230" height="120" rx="8" fill="url(#accent)" opacity="0.25" />
  <circle cx="230" cy="205" r="30" fill="url(#accent)" opacity="0.6" />
  <path d="M 220 205 L 227 212 L 243 196" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
  
  <rect x="115" y="280" width="140" height="14" rx="4" fill="#f1f5f9" opacity="0.9" />
  <rect x="115" y="304" width="200" height="10" rx="3" fill="#64748b" />
  <rect x="115" y="322" width="160" height="10" rx="3" fill="#64748b" />
  <rect x="115" y="355" width="90" height="32" rx="6" fill="#6366f1" />
  <text x="160" y="375" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Checkout</text>
  <rect x="220" y="355" width="125" height="32" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="282" y="375" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Razorpay Active</text>

  <!-- Right Side: CMS Analytics & Order Admin -->
  <rect x="390" y="125" width="310" height="135" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="410" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">Admin CMS Overview</text>
  
  <!-- Mini Stat Badges -->
  <rect x="410" y="170" width="80" height="65" rx="6" fill="#1e293b" />
  <text x="450" y="195" fill="#818cf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">JWT</text>
  <text x="450" y="218" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">RBAC Auth</text>

  <rect x="505" y="170" width="80" height="65" rx="6" fill="#1e293b" />
  <text x="545" y="195" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CDN</text>
  <text x="545" y="218" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Cloudinary</text>

  <rect x="600" y="170" width="80" height="65" rx="6" fill="#1e293b" />
  <text x="640" y="195" fill="#f43f5e" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">REST</text>
  <text x="640" y="218" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">MongoDB</text>

  <!-- Right Bottom: Orders Table Mock -->
  <rect x="390" y="275" width="310" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <rect x="405" y="295" width="280" height="24" rx="4" fill="#1e293b" />
  <rect x="405" y="327" width="280" height="22" rx="4" fill="#1e1b4b" opacity="0.6" />
  <rect x="405" y="356" width="280" height="22" rx="4" fill="#1e293b" />
  <circle cx="420" cy="307" r="4" fill="#10b981" />
  <circle cx="420" cy="338" r="4" fill="#6366f1" />
  <circle cx="420" cy="367" r="4" fill="#f59e0b" />
  <text x="440" y="311" fill="#cbd5e1" font-family="sans-serif" font-size="11">Order #8492 - Verified</text>
  <text x="440" y="342" fill="#cbd5e1" font-family="sans-serif" font-size="11">Order #8491 - Dispatched</text>
  <text x="440" y="371" fill="#cbd5e1" font-family="sans-serif" font-size="11">Order #8490 - Processing</text>
</svg>